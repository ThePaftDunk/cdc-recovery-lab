services:
  kafka:
    image: apache/kafka:4.0.2
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 30
  source-db:
    image: postgres:16.6
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment: {POSTGRES_DB: app, POSTGRES_USER: demo, POSTGRES_PASSWORD: demo}
    volumes: ["source-data:/var/lib/postgresql/data", "./ops/source.sql:/docker-entrypoint-initdb.d/source.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d app"]
      interval: 3s
      timeout: 3s
      retries: 30
  sink-db:
    image: postgres:16.6
    ports: ["127.0.0.1:5433:5432"]
    environment: {POSTGRES_DB: sink, POSTGRES_USER: demo, POSTGRES_PASSWORD: demo}
    volumes: ["sink-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d sink"]
      interval: 3s
      timeout: 3s
      retries: 30
  connect:
    image: quay.io/debezium/connect:3.0
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      kafka: {condition: service_healthy}
      source-db: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: recovery-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
  worker:
    build: .
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      kafka: {condition: service_healthy}
      sink-db: {condition: service_healthy}
    environment:
      JDBC_URL: jdbc:postgresql://sink-db:5432/sink
      DB_USER: demo
      DB_PASSWORD: demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: cdc-recovery-lab
      KAFKA_TOPIC: customers
volumes:
  kafka-data:
  source-data:
  sink-data:
